[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-link-adaptation"
version = "0.1.0"
description = "Reinforcement-learning environment and Q-learning baseline for wireless link adaptation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mahmoud Alqudah"}]
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
rl-link = "rl_link.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
